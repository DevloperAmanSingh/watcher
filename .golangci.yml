run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - misspell
    - errorlint
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - unconvert
    - wastedassign

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable:
      - shadow
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test helpers are allowed to ignore cleanup errors.
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
